{{- $items := partialCached "navigation/breadcrumbs.html" . .Path -}}
<nav class="breadcrumbs" aria-label="Breadcrumb" data-pagefind-ignore>
  {{- range $index, $item := $items -}}
    {{- if $index -}}<span aria-hidden="true">/</span>{{- end -}}
    {{- if eq $index (sub (len $items) 1) -}}
      <span aria-current="page">{{ .label }}</span>
    {{- else -}}
      <a href="{{ .url }}">{{ .label }}</a>
    {{- end -}}
  {{- end -}}
</nav>
