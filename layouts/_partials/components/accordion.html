<details
  id="{{ urls.Anchorize .title }}"
  class="accordion"
  {{ if eq (printf "%v" .open) "true" }}open{{ end }}
>
  <summary>
    {{ with .icon }}
      {{ partial "ui-icon.html" (dict "name" .) }}
    {{ end }}
    <span class="{{ if .large }}text-xl{{ end }} accordion-title">
      {{ .title }}
    </span>
    {{ partial "ui-icon.html" (dict "name" "chevron-down") }}
  </summary>
  <div class="accordion-content">
    {{ markdownify .body }}
  </div>
</details>
