{{ $description := partial "utils/description.html" . }}
{{ if .IsHome }}
  <title>{{ site.Title }}</title>
{{ else }}
  <title>
    {{ printf "%s | %s" .Title site.Title }}
  </title>
{{ end }}
{{ if or (eq .Kind "404") (eq .Params.sitemap false) (not hugo.IsProduction) }}
  <meta name="robots" content="noindex" />
{{ end }}
<meta name="description" content="{{ $description }}" />
<meta
  name="keywords"
  content="{{- delimit (partialCached "utils/keywords.html" . .) ", " -}}"
/>
<link rel="canonical" href="{{ .Permalink }}" />

<!-- favicon -->
<link rel="icon" type="image/png" href="/favicon-96x96.png?v=3" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
<link rel="icon" type="image/png" href="/favicon-192x192.png?v=3" sizes="192x192" />
<link rel="shortcut icon" href="/favicon.ico?v=3" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />

<!-- SEO -->
<meta name="twitter:title" itemprop="title name" content="{{ .Title }}" />
<meta
  name="twitter:description"
  property="og:description"
  itemprop="description"
  content="{{ $description }}"
/>
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:domain" content="{{ site.BaseURL }}" />
<meta name="twitter:site" content="@docker_docs" />
<meta name="twitter:url" content="https://twitter.com/docker_docs" />
<meta
  name="twitter:image:src"
  content="{{ (resources.Get "images/thumbnail.png").Permalink }}"
/>
<meta name="twitter:image:alt" content="Docker Documentation" />
<meta property="og:title" content="{{ .Title }}" />
<meta property="og:description" content="{{ $description }}" />
<meta property="og:type" content="website" />
<meta
  property="og:updated_time"
  itemprop="dateUpdated"
  content="{{ .Lastmod }}"
/>
<meta
  property="og:image"
  itemprop="image primaryImageOfPage"
  content="{{ (resources.Get "images/thumbnail.png").Permalink }}"
/>
<meta property="og:locale" content="en_US" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:site_name" content="Docker Documentation" />
<meta
  property="article:published_time"
  itemprop="datePublished"
  content="{{ .PublishDate | default .Lastmod }}"
/>
{{ partial "schema.html" . }}
