{{ if ne .Params.apiReferenceBanner false }}
  {{ $data := index hugo.Data "api-reference" }}
  {{ range $data.apis }}
    {{ $manual := site.GetPage .manual }}
    {{ if and $manual (eq $manual.RelPermalink $.RelPermalink) }}
      <p
        class="my-4 rounded border border-(--color-info-subtle-hover) bg-(--color-info-subtle) p-4 text-sm text-(--color-info-subtle-foreground)"
      >
        <a href="{{ .url }}">Explore the {{ .title }} API {{ .version }} →</a>
      </p>
    {{ end }}
  {{ end }}
{{ end }}
