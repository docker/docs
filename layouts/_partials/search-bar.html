<dialog
  id="docs-search"
  class="search-dialog"
  aria-labelledby="search-heading"
  x-data="docsSearch"
  @keydown.enter="if ($event.metaKey || $event.ctrlKey) { $event.preventDefault(); ask(); }"
>
  <div class="search-dialog-header">
    <h2 id="search-heading">Search or ask Docker</h2>
    <button type="button" data-close-search aria-label="Close search">
      {{ partial "ui-icon.html" (dict "name" "x") }}
    </button>
  </div>
  <label class="sr-only" for="search-query">Search documentation</label>
  <div class="search-dialog-input">
    {{ partial "ui-icon.html" (dict "name" "search") }}
    <input
      id="search-query"
      type="search"
      x-model="query"
      @input="queueSearch($event.target.value)"
      placeholder="Search Docker documentation…"
      autocomplete="off"
    />
  </div>
  <button
    type="button"
    class="search-ask"
    @click="ask()"
    :disabled="!query.trim()"
    disabled
  >
    {{ partial "ui-icon.html" (dict "name" "bot") }}
    <span class="search-ask-content">
      <span class="search-ask-title">Ask Docker</span>
      <span
        class="search-ask-query"
        x-text="query.trim() || 'Get an answer from the documentation'"
      ></span>
    </span>
    <kbd x-text="/Mac|iPhone|iPad/.test(navigator.platform) ? '⌘ ↵' : 'Ctrl ↵'"
      >Ctrl ↵</kbd
    >
  </button>
  {{ partial "search-results.html" . }}
</dialog>
