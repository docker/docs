<!-- Gordon AI Chat Panel -->
<script>
  window.GORDON_BASE_URL = {{ if eq hugo.Environment "production" -}}
    'https://ai-backend-service.docker.com'
  {{- else if getenv "HUGO_GORDON_URL" -}}
    '{{ getenv "HUGO_GORDON_URL" }}'
  {{- else -}}
    'https://ai-backend-service-stage.docker.com'
  {{- end }};
  {{- $gordonCards := resources.Get "js/gordon-cards/index.js"
    | js.Build (dict "minify" true "targetPath" "gordon-cards.js")
  }}
  window.GORDON_CARDS_SRC = '{{ $gordonCards.RelPermalink }}';
  // Lets Gordon answer with cards. Always on outside production builds.
  window.GORDON_CARDS_ENABLED = {{ or (ne hugo.Environment "production") site.Params.gordon.cards }};
</script>
<template id="gordon-code-copy">
  {{- partial "code-copy.html" (dict "text" "") -}}
</template>
<div
  x-data="{
    isLoading: false,
    error: null,
    announcement: '',
    messages: $persist([]).using($gordonStorage).as('gordon-messages'),
    currentQuestion: '',
    threadId: $persist(null).using($gordonStorage).as('gordon-threadId'),
    includePageContext: $persist(true).using($gordonStorage).as('gordon-includePageContext'),
    maxTurnsPerThread: 10,

    init() {
      // Clean up any streaming messages that might be persisted
      this.messages = this.messages.filter(m => !m.isStreaming)
      let question
      for (const message of this.messages) {
        if (message.role === 'user') question = message.content
        else message.question = question
      }

      // Watch for query from store and populate input
      this.$watch('$store.gordon.query', (query) => {
        if (query) {
          this.currentQuestion = query
          const shouldAutoSubmit = this.$store.gordon.autoSubmit
          this.$nextTick(() => {
            if (shouldAutoSubmit) {
              this.askQuestion()
            } else {
              this.$refs.input?.focus()
              this.$refs.input?.select()
            }
          })
          // Clear the store query and autoSubmit flag after using them
          this.$store.gordon.query = ''
          this.$store.gordon.autoSubmit = false
        }
      })
    },

    getTurnCount() {
      return this.messages.filter(m => m.role === 'user').length
    },

    getRemainingTurns() {
      return this.maxTurnsPerThread - this.getTurnCount()
    },

    isThreadLimitReached() {
      return this.getTurnCount() >= this.maxTurnsPerThread
    },

    shouldShowCountdown() {
      const remaining = this.getRemainingTurns()
      return remaining > 0 && remaining <= 3
    },

    async askQuestion() {
      const question = this.currentQuestion.trim()
      if (!question || this.isLoading || this.isThreadLimitReached()) {
        return
      }

      // Add user message to UI
      this.messages.push({
        role: 'user',
        content: question
      })

      this.currentQuestion = ''
      // Reset textarea height
      this.$nextTick(() => {
        if (this.$refs.input) {
          this.$refs.input.style.height = 'auto'
        }
      })
      this.announcement = 'Preparing an answer.'
      this.isLoading = true
      this.error = null

      // Add placeholder for assistant response
      const responseIndex = this.messages.length
      this.messages.push({
        role: 'assistant',
        question,
        content: '',
        isStreaming: true,
        questionAnswerId: null,
        feedback: null,
        copied: false
      })
      const answer = this.messages[responseIndex]
      let announcement

      this.$nextTick(() => {
        if (this.messages[responseIndex] !== answer) return
        this.$refs.messagesContainer?.scrollTo({
          top: this.$refs.messagesContainer.scrollHeight,
          behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'
        })
      })

      try {
        await this.streamGordonResponse(responseIndex, answer)
        if (this.messages[responseIndex] !== answer) return
        const answerText = this.$markdownText(answer.content)
        announcement = 'Ask Docker: ' + (answerText || 'No answer received.')
      } catch (err) {
        if (this.messages[responseIndex] === answer) {
          if (err.message === 'RATE_LIMIT_EXCEEDED') {
            this.error = 'You\'ve exceeded your question quota for the day. Please come back tomorrow.'
          } else {
            this.error = 'Failed to get response. Please try again.'
          }
        }
        console.error('Gordon API error:', err)
      } finally {
        if (this.messages[responseIndex] === answer) {
          this.isLoading = false
          this.announcement = this.error || announcement
          if (this.error) this.messages.splice(responseIndex, 1)
          this.$nextTick(() => {
            if (!this.isLoading && this.$store.gordon.isOpen && document.activeElement === document.body) this.$refs.input?.focus()
          })
        }
      }
    },

    getSessionId() {
      let sessionId = this.$gordonStorage.getItem('gordon-session-id')
      if (!sessionId) {
        sessionId = `docs-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`
        this.$gordonStorage.setItem('gordon-session-id', sessionId)
      }
      return sessionId
    },

    async streamGordonResponse(responseIndex, answer) {

      // Build API request from messages, excluding the streaming placeholder
      // The placeholder is at responseIndex, so we take everything before it
      const conversationMessages = this.messages.slice(0, responseIndex).map((msg, i) => {
        const message = {
          role: msg.role,
          content: msg.content
        }

        // Add copilot_references to the last message (most recent user question)
        if (i === responseIndex - 1) {
          message.copilot_references = [
            {
              data: {
                origin: 'docs-website',
                email: 'docs@docker.com',
                uuid: this.getSessionId(),
                action: 'AskGordon',
                ...(window.GORDON_CARDS_ENABLED && { ui: 'openui-v1' }),
                ...(this.includePageContext && {
                  page_url: window.location.href,
                  {{ with .Title }}page_title: {{ . | jsonify }}{{ end }}
                })
              }
            }
          ]
        }

        return message
      })

      const isNewConversation = !this.threadId
      const payload = {
        messages: conversationMessages,
        ...(this.threadId && { thread_uuid: this.threadId })
      }

      const response = await fetch(window.GORDON_BASE_URL + '/public/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })

      if (!response.ok) {
        if (response.status === 429) {
          throw new Error('RATE_LIMIT_EXCEEDED')
        }
        throw new Error(`HTTP ${response.status}: ${response.statusText}`)
      }

      const reader = response.body.getReader()
      const decoder = new TextDecoder()
      let buffer = ''

      while (true) {
        const { done, value } = await reader.read()
        if (this.messages[responseIndex] !== answer) {
          await reader.cancel()
          return
        }
        buffer += done ? decoder.decode() : decoder.decode(value, { stream: true })
        const lines = buffer.split('\n')
        buffer = done ? '' : lines.pop()

        for (const line of lines) {
          if (!line.trim() || !line.startsWith('data: ')) continue

          const data = line.slice(6).trim()
          if (data === '[DONE]') continue

          try {
            const parsed = JSON.parse(data)

            // Capture thread_id for new conversations
            if (parsed.thread_id) {
              if (isNewConversation) {
                this.threadId = parsed.thread_id  // $persist auto-saves to sessionStorage
              } else if (parsed.thread_id !== this.threadId) {
                console.warn('Backend returned unexpected thread_id:', parsed.thread_id)
              }
              continue
            }

            // Capture question_answer_id for feedback
            if (parsed.question_answer_id) {
              answer.questionAnswerId = parsed.question_answer_id
              continue
            }

            if (parsed.choices && parsed.choices[0]?.delta?.content) {
              const content = parsed.choices[0].delta.content
              answer.content += content

              this.$nextTick(() => {
                if (this.messages[responseIndex] !== answer) return
                const container = this.$refs.messagesContainer
                if (container) {
                  const isNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100
                  if (isNearBottom) {
                    container.scrollTop = container.scrollHeight
                  }
                }
              })
            }
          } catch (e) {
            console.error('Failed to parse SSE data:', e)
          }
        }
        if (done) break
      }

      answer.isStreaming = false
    },

    clearChat() {
      if (confirm('Clear all messages?')) {
        this.messages = []      // $persist auto-saves empty array
        this.threadId = null    // $persist auto-removes from sessionStorage
        this.isLoading = false
        this.announcement = 'Chat cleared.'
        this.$nextTick(() => this.$refs.input?.focus())
        this.error = null
      }
    },

    formatMessageContent(message) {
      return this.$markdown(message.content, { streaming: message.isStreaming === true, tableLabel: message.question })
    },

    askFollowUp(event) {
      const chip = event.target.closest('[data-gordon-follow-up]')
      if (!chip || this.isLoading || this.isThreadLimitReached()) {
        return
      }
      this.currentQuestion = chip.dataset.gordonFollowUp
      this.$refs.input?.focus()
      this.askQuestion()
    },

    async getCopyText(content) {
      if (!content.includes('```openui-lang')) {
        return content
      }
      try {
        const cards = await this.$gordonCards()
        return cards.gordonAnswerToMarkdown(content)
      } catch (err) {
        console.error('Gordon cards:', err)
        return content
      }
    },

    async submitFeedback(messageIndex, feedbackType) {
      const message = this.messages[messageIndex]

      if (message.feedback === feedbackType) {
        return
      }

      // Clear any previous error
      message.feedbackError = null

      if (!message.questionAnswerId) {
        message.feedbackError = 'Unable to submit feedback'
        console.error('No question_answer_id available for feedback')
        return
      }

      try {
        const response = await fetch(window.GORDON_BASE_URL + '/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: message.questionAnswerId,
            feedback: feedbackType
          })
        })

        if (response.ok) {
          message.feedback = feedbackType  // $persist auto-saves
        } else {
          message.feedbackError = 'Unable to submit feedback'
          console.error('Failed to submit feedback:', response.status, response.statusText)
        }
      } catch (err) {
        message.feedbackError = 'Unable to submit feedback'
        console.error('Error submitting feedback:', err)
      }
    },

    async copyAnswer(messageIndex) {
      const message = this.messages[messageIndex]
      if (!message.content) return

      message.copyError = ''
      try {
        await navigator.clipboard.writeText(await this.getCopyText(message.content))
        message.copied = true
        this.$nextTick(() => {
          setTimeout(() => {
            message.copied = false
          }, 2000)
        })
      } catch (err) {
        message.copyError = 'Could not copy. Select and copy the answer text instead.'
        console.error('Failed to copy:', err)
      }
    }
  }"
  x-cloak
  @keydown.escape.window="if (!$store.gordon.isDocked || $el.contains($event.target)) $store.gordon.close()"
>
  <!-- Overlay backdrop -->
  <div
    x-show="$store.gordon.isOpen && !$store.gordon.isDocked"
    x-transition.opacity.duration.300ms
    @click="$store.gordon.close()"
    class="gordon-backdrop fixed inset-0 z-40 bg-black/50"
  ></div>

  <!-- Chat panel sliding in from right -->
  <div
    id="gordon-chat"
    role="dialog"
    :aria-modal="$store.gordon.isDocked ? null : 'true'"
    aria-labelledby="gordon-title"
    x-trap.inert.noscroll="$store.gordon.isOpen && !$store.gordon.isDocked"
    :data-docked="$store.gordon.isDocked"
    :data-open="$store.gordon.isOpen"
    x-show="$store.gordon.isOpen"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="translate-x-full"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="translate-x-full"
    class="gordon-drawer"
  >
    <!-- Header -->
    <div class="gordon-header">
      <div class="flex items-center gap-3">
        {{ partial "ui-icon.html" (dict "name" "bot") }}
        <h2 id="gordon-title">Ask Docker</h2>
      </div>
      <div class="flex items-center gap-2">
        <div data-tooltip-wrapper class="relative">
          <button
            @click="clearChat()"
            aria-label="Start a new chat"
            class="gordon-header-action"
            :disabled="messages.length === 0"
          >
            {{ partial "ui-icon.html" (dict "name" "refresh-cw") }}
          </button>
          <div
            id="gordon-tooltip"
            data-tooltip-body
            class="absolute top-0 left-0 hidden rounded-sm bg-gray-900 p-2 text-sm whitespace-nowrap text-white"
            role="tooltip"
          >
            Start a new chat
            <div
              data-tooltip-arrow
              class="absolute h-2 w-2 rotate-45 bg-gray-900"
            ></div>
          </div>
        </div>
        <button
          @click="$store.gordon.close()"
          title="Close chat drawer"
          class="gordon-header-action"
          aria-label="Close chat"
        >
          {{ partial "ui-icon.html" (dict "name" "x") }}
        </button>
      </div>
    </div>

    <p
      class="sr-only"
      role="status"
      aria-atomic="true"
      x-text="announcement"
    ></p>
    <!-- Messages container -->
    <div
      x-ref="messagesContainer"
      @click="askFollowUp($event)"
      class="gordon-messages"
    >
      <!-- Welcome message when empty -->
      <template x-if="messages.length === 0">
        <div class="gordon-welcome">
          <div class="flex w-full flex-col items-center justify-start gap-3">
            <h3 class="gordon-welcome-title">What can I help you with?</h3>
            <p class="gordon-welcome-description">
              Get help with Docker and find answers in the documentation.
            </p>
            <div class="w-full text-left">
              <p class="gordon-suggestions-label">Try asking</p>
            </div>
            {{- $gordonSuggestions := slice
              (dict
              "title" "Get started with Docker"
              "question" "Help me get started with Docker. What should I do first?"
              "icon" "rocket")
              (dict
              "title" "Docker Hardened Images"
              "question" "How do Docker Hardened Images work?"
              "icon" "icons/dhi.svg")
              (dict
              "title" "MCP Toolkit"
              "question" "What is MCP Toolkit?"
              "icon" "icons/toolkit.svg")
              (dict
              "title" "Create an org"
              "question" "How do I create an org?"
              "icon" "icons/headset.svg")
            -}}
            <div class="gordon-suggestions">
              {{- range $gordonSuggestions }}
                <button
                  @click="currentQuestion = {{ .question | jsonify }}; askQuestion()"
                  class="gordon-suggestion"
                >
                  <div class="flex items-center gap-3">
                    <span class="icon-svg shrink-0">
                      {{ partialCached "icon" .icon .icon }}
                    </span>
                    <p class="text-sm font-medium">{{ .title }}</p>
                  </div>
                </button>
              {{- end }}
            </div>
          </div>
        </div>
      </template>

      <!-- Messages -->
      <div x-show="messages.length > 0" class="relative flex flex-col gap-4">
        <template x-for="(message, index) in messages" :key="index">
          <div
            :class="message.role === 'user' ? 'flex justify-end' : 'flex justify-start'"
          >
            <div
              :class="message.role === 'user' ? '' : 'w-full'"
              class="flex max-w-full flex-col gap-2"
            >
              <div
                :class="message.role === 'user' ? 'gordon-user-message' : 'max-w-none'"
                class="prose prose-sm dark:prose-invert"
              >
                <template x-if="!message.content && message.isStreaming">
                  <div class="flex gap-1 py-3" aria-hidden="true">
                    <span
                      class="inline-block h-2 w-2 animate-bounce rounded-full bg-current"
                      style="animation-delay: 0ms"
                    ></span>
                    <span
                      class="inline-block h-2 w-2 animate-bounce rounded-full bg-current"
                      style="animation-delay: 150ms"
                    ></span>
                    <span
                      class="inline-block h-2 w-2 animate-bounce rounded-full bg-current"
                      style="animation-delay: 300ms"
                    ></span>
                  </div>
                </template>
                <template x-if="message.content">
                  <div x-html="formatMessageContent(message)"></div>
                </template>
              </div>
              <!-- Feedback buttons for assistant messages -->
              <template
                x-if="message.role === 'assistant' && !message.isStreaming"
              >
                <div class="flex flex-col gap-2">
                  <p class="gordon-feedback-label">Was this helpful?</p>
                  <div class="gordon-feedback-actions">
                    <!-- Feedback buttons group -->
                    <div class="gordon-feedback-votes">
                      <!-- Thumbs up - Helpful -->
                      <button
                        @click="submitFeedback(index, 'positive')"
                        :aria-pressed="message.feedback === 'positive'"
                        class="gordon-feedback"
                        title="Helpful"
                      >
                        <span class="icon-svg icon-sm transition-transform">
                          {{ partialCached "icon" "thumbs-up" "thumbs-up" }}
                        </span>
                        <span>Helpful</span>
                      </button>

                      <!-- Thumbs down - Not quite -->
                      <button
                        @click="submitFeedback(index, 'negative')"
                        :aria-pressed="message.feedback === 'negative'"
                        class="gordon-feedback"
                        title="Not quite"
                      >
                        <span class="icon-svg icon-sm transition-transform">
                          {{ partialCached "icon" "thumbs-down" "thumbs-down" }}
                        </span>
                        <span>Not quite</span>
                      </button>
                    </div>

                    <!-- Copy button -->
                    <button
                      @click="copyAnswer(index)"
                      class="gordon-feedback gordon-feedback-copy"
                      :title="message.copied ? 'Copied!' : 'Copy answer'"
                    >
                      <span
                        x-show="message.copied !== true"
                        class="icon-svg icon-sm"
                      >
                        {{ partialCached "icon" "copy" "copy" }}
                      </span>
                      <span
                        x-show="message.copied === true"
                        class="icon-svg icon-sm"
                      >
                        {{ partialCached "icon" "check" "check" }}
                      </span>
                      <span
                        role="status"
                        x-text="message.copied ? 'Copied!' : 'Copy'"
                        >Copy</span
                      >
                    </button>
                  </div>

                  <p
                    role="status"
                    class="text-xs"
                    x-text="message.copyError || ''"
                  ></p>
                  <!-- Error message -->
                  <template x-if="message.feedbackError">
                    <div
                      x-transition:enter="transition ease-out duration-200"
                      x-transition:enter-start="opacity-0 translate-y-1"
                      x-transition:enter-end="opacity-100 translate-y-0"
                      role="alert"
                      class="flex items-center gap-1.5 text-xs text-(--color-destructive-ink)"
                    >
                      <span x-text="message.feedbackError"></span>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- Error message -->
      <template x-if="error">
        <div
          class="rounded-lg border border-(--color-edge) bg-(--color-destructive-subtle) p-4 text-(--color-destructive-subtle-foreground)"
        >
          <p class="text-sm" x-text="error"></p>
        </div>
      </template>

      <!-- Countdown warning when approaching limit -->
      <template x-if="shouldShowCountdown()">
        <div
          class="rounded-lg border border-(--color-edge) bg-(--color-warning-subtle) p-3 text-(--color-warning-subtle-foreground)"
        >
          <p class="text-sm">
            <span x-text="getRemainingTurns()"></span>
            <span
              x-text="getRemainingTurns() === 1 ? 'question' : 'questions'"
            ></span>
            remaining in this thread.
          </p>
        </div>
      </template>

      <!-- Thread limit warning -->
      <template x-if="isThreadLimitReached()">
        <div class="gordon-thread-notice">
          <p class="mb-3 text-sm">
            You've reached the maximum of
            <span x-text="maxTurnsPerThread"></span> questions per thread. For
            better answer quality, start a new thread.
          </p>
          <button @click="clearChat()" class="gordon-restart">
            Start a new thread
          </button>
        </div>
      </template>
    </div>

    <!-- Input area -->
    <form @submit.prevent="askQuestion()" class="gordon-form">
      <div class="relative w-full">
        <div class="relative flex-1 self-stretch">
          <textarea
            id="question"
            x-ref="input"
            aria-label="Ask a question about Docker"
            autofocus
            x-model="currentQuestion"
            @input="$el.style.height = 'auto'; $el.style.height = Math.min(160, $el.scrollHeight) + 'px'"
            @keydown.enter="if (!$event.shiftKey && !$event.isComposing) { $event.preventDefault(); askQuestion() }"
            placeholder="Ask a question about Docker..."
            rows="3"
            :readonly="isLoading"
            :disabled="isThreadLimitReached()"
            class="gordon-input"
          ></textarea>
        </div>
        <button
          type="submit"
          :disabled="!currentQuestion.trim() || isLoading || isThreadLimitReached()"
          :title="isLoading ? 'Sending...' : (isThreadLimitReached() ? 'Thread limit reached. Start a new thread.' : 'Send question')"
          class="gordon-send"
        >
          <template x-if="!isLoading">
            {{ partial "ui-icon.html" (dict "name" "send") }}
          </template>
          <template x-if="isLoading">
            <span class="icon-svg animate-spin">
              {{ partialCached "icon" "refresh-cw" "refresh-cw" }}
            </span>
          </template>
        </button>
      </div>
      <div class="flex justify-end">
        <a
          href="https://github.com/docker/docs/issues/23966"
          target="_blank"
          rel="noopener noreferrer"
          class="text-xs text-(--color-muted-foreground) underline hover:text-(--color-primary-ink)"
        >
          Share feedback
        </a>
      </div>
    </form>

    <!-- Disclaimer -->
    <div class="gordon-disclaimer">
      Answers are generated based on the documentation.
    </div>
  </div>
</div>
