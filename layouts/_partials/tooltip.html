{{- /*
  Renders a tooltip component using Floating UI for positioning.
  See script at `assets/js/src/tooltip.js` for functionality.
  */
-}}
<div data-tooltip-wrapper>
  <button
    type="button"
    aria-label="More information"
    data-tooltip-button
    class="icon-svg flex items-center text-(--color-muted-foreground)"
  >
    {{ partialCached "icon" "circle-help" "circle-help" }}
  </button>
  <div
    data-tooltip-body
    class="absolute top-0 left-0 hidden max-w-56 rounded-sm bg-gray-700 p-2 text-white dark:bg-gray-300 dark:text-gray-800"
    role="tooltip"
  >
    {{ . }}
    <div
      data-tooltip-arrow
      class="absolute h-2 w-2 rotate-45 bg-gray-700 dark:bg-gray-300"
    ></div>
  </div>
</div>
