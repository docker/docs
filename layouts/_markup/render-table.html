<div class="overflow-x-auto" tabindex="0">
  <table
    {{- range $k, $v := .Attributes }}
      {{- if $v }}
        {{- printf " %s=%q" $k $v | safeHTMLAttr }}
      {{- end }}
    {{- end }}
  >
    <thead class="bg-gray-100 dark:bg-gray-800">
      {{- range .THead }}
        <tr>
          {{- range . }}
            {{- if strings.TrimSpace (.Text | plainify) }}
              <th
                scope="col"
                class="p-2"
                {{- with .Alignment }}
                  {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
                {{- end -}}
              >
                {{- .Text -}}
              </th>
            {{- else }}
              <td class="p-2"></td>
            {{- end }}
          {{- end }}
        </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
        <tr>
          {{- range . }}
            <td
              class="p-2"
              {{- with .Alignment }}
                {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
              {{- end -}}
            >
              {{- .Text -}}
            </td>
          {{- end }}
        </tr>
      {{- end }}
    </tbody>
  </table>
</div>
