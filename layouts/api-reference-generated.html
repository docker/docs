{{/* Upstream renders the reference to Markdown. Keep long operation paths and
  schema names readable on narrow screens without wrapping fenced examples.
*/}}
{{ define "article" }}
  <article
    class="prose dark:prose-invert max-w-4xl [overflow-wrap:anywhere] [&_:not(pre)>code]:whitespace-normal"
  >
    {{ partial "content-default.html" . }}
  </article>
{{ end }}
