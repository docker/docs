# Serves the single-page app and proxies /api to the API container.
# TLS is expected to end at a load balancer or a TLS proxy in front of this
# container; once it does, enable the Strict-Transport-Security line below.
# The image serves on 8080 as a non-root user.

map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Replace (not append) the client's header: the API trusts exactly one hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Security headers for the app (the API sets its own, stricter ones). nginx
  # drops inherited add_header lines in a location that has its own, so they live here.
  location / {
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri /index.html;
  }
}
