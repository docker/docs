enableGitInfo: false
params:
  apiPrototype: true
module:
  mounts:
    - source: content
      target: content
      files:
        - "! reference/api/_index.md"
        - "! reference/api/ai-governance/index.md"
        - "! reference/api/hub/latest.md"
        - "! reference/api/dvp/latest.md"
        - "! reference/api/registry/latest.md"
        - "! reference/api/engine/version/v1.56.md"
    - source: prototypes/api-docs/preview/layouts
      target: layouts
    - source: layouts
      target: layouts
    - source: static
      target: static
    - source: data
      target: data
    - source: assets
      target: assets
    - source: node_modules/heroicons/24/solid
      target: assets/icons
    - source: node_modules/highlight.js/styles/github-dark.css
      target: assets/css/highlight-github-dark.css
    - source: prototypes/api-docs/preview/content
      target: content
    - source: prototypes/api-docs/preview/assets
      target: assets
    - source: tmp/api-prototype/data
      target: data
    - source: tmp/api-prototype/static
      target: static
