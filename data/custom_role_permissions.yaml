      # - name: View tags
      #   description: View image tags in repositories
      #   relation: permset-repo-tag-read
      # - name: Manage tags
      #   description: Delete image tags in repositories
      #   relation: permset-repo-tag-write
      # - name: View images
      #   description: View image list and reclaimable size
      #   relation: permset-repo-image-read
      # - name: Manage images
