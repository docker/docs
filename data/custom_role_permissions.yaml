      #   relation: permset-repo-team-read
      # - name: Manage teams
      #   description: Create, update, and delete repository teams
      #   relation: permset-repo-team-write

  - name: Billing
    relations:
      - name: View billing
        description: View organization billing information
        relation: permset-billing-read
      - name: Manage billing
        description: Complete access to managing organization billing
        relation: permset-billing-manage

  - name: Licensing
    relations:
      - name: Manage licenses
        description: Assign and revoke licenses for members and manage auto-assign rules. Does not include purchasing or changing the number of licenses.
        relation: permset-license-manage

  - name: AI Governance
    relations:
      - name: View policies
        description: View existing AI Governance policies and their rules
        relation: permset-governance-policy-read
      - name: Manage policies
        description: Full access to AI Governance policy management
        relation: permset-governance-policy-write
      - name: View audit logs
        description: View audit events for the organization
        relation: permset-audit_events-read
      - name: Manage audit settings
        description: Update audit configuration for the organization
        relation: permset-audit_settings-write

  - name: DHI (Docker Hardened Images)
    relations:
      - name: Create DHI mirrors
        description: Create Docker Hardened Image mirror repositories
        relation: permset-dhi-mirror-write
      - name: Manage customizations
        description: Create, update, and delete Docker Hardened Image customizations
        relation: permset-dhi-customization-write

  - name: Docker Offload
    relations:
      - name: Offload Read-Only
        description: View Offload account status, leases, and zones
        relation: permset-offload-read

  - name: Cloud Sandboxes
    relations:
      - name: Use Cloud Sandboxes
        description: Create and use Docker Cloud Sandboxes
        relation: permset-sandbox-use
