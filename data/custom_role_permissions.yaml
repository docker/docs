# File contains metadata that is used to drive the roles UI screen.
# Custom role permissions are grouped together by domain model (note these grouping have no logical impact on access control service).
#
# Only permissions defined below will show up in the UI.
groups:
  - name: Organization management
    relations:
      - name: View teams
        description: View teams and team members
        relation: permset-group-read
      - name: Manage teams
        description: Create, update, and delete teams and team members
        relation: permset-group-write
      - name: Manage registry access
        description: Control which registries members can access
        relation: permset-registry-access-management-write
      - name: Manage image access
        description: Set policies for which images members can pull and use
        relation: permset-image-access-management-write
      - name: Update organization information
        description: Update organization information such as name and location
        relation: permset-organization-info-write
      - name: Member management
        description: Manage organization members, invites, and roles
        relation: permset-member-write
      - name: View custom roles
        description: View existing custom roles and their permissions
        relation: permset-custom-role-read
      - name: Manage custom roles
        description: Full access to custom role management and assignment
        relation: permset-custom-role-write
      - name: Manage organization access tokens
        description: Create, update, and delete organization access tokens
        relation: permset-access-token-write
      - name: View activity logs
        description: Access organization audit logs and activity history
        relation: permset-activity-log-read
      - name: View usage reports
        description: Download organization usage reports (pulls, storage)
        relation: permset-report-read
      - name: View domains
        description: View domains and domain audit settings
        relation: permset-domain-read
      - name: Manage domains
        description: Manage verified domains and domain audit settings
        relation: permset-domain-write
      - name: View SSO and SCIM
        description: View single sign-on and user provisioning configurations
        relation: permset-sso-read
      - name: Manage SSO and SCIM
        description: Full access to SSO and SCIM management
        relation: permset-sso-write
      - name: Manage Desktop settings
        description: Configure Docker Desktop settings policies and view usage reports
        relation: permset-desktop-settings-write
      - name: View OIDC connections
        description: View OIDC connections and their configuration
        relation: permset-oidc-read
      - name: Manage OIDC connections
        description: View, create, edit, and delete OIDC connections
        relation: permset-oidc-write

  - name: Docker Hub
    relations:
      - name: View repositories
        description: View repository details and contents
        relation: permset-repo-read
      - name: Manage repositories
        description: Full repository management including settings, webhooks, privacy, Dockerfile, immutable tags.
        relation: permset-repo-write
      - name: Manage repository team permissions
        description: Add and remove teams from a repository, and manage team access level
        relation: permset-repo-group-write
