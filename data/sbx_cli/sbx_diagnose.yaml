name: sbx diagnose
synopsis: Diagnose common issues with your sbx installation
usage: sbx diagnose [flags]
options:
    - name: format
      usage: 'Output format: table, json, yaml or github-issue'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for diagnose
    - name: json
      default_value: "false"
      usage: Output in JSON format
    - name: upload
      default_value: "false"
      usage: Upload diagnostics to Docker support
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
example: |4-
      sbx diagnose

      # Print the report as JSON
      sbx diagnose --format json

      # Upload the report to Docker support
      sbx diagnose --upload
see_also:
    - sbx - Manage AI coding agent sandboxes.
