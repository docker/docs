name: sbx kit builder rm
synopsis: Remove the kit builder sandbox and its build cache
experimental: true
usage: sbx kit builder rm [flags]
options:
    - name: force
      shorthand: f
      default_value: "false"
      usage: Skip confirmation prompts and delete even if in use
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for rm
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
see_also:
    - sbx kit builder - Manage the kit builder sandbox
