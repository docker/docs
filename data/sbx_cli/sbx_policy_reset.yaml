name: sbx policy reset
synopsis: Reset policies to defaults
description: |-
    Remove all custom policies and restart the daemon to restore defaults.

    This deletes the local policy store and restarts the daemon immediately. You
    are then prompted to choose the global network policy; without an interactive
    terminal, initialize it after the reset by choosing a preset as shown below.

    If sandboxes are currently running, they will be stopped when the daemon
    shuts down. You will be prompted for confirmation unless --force is used.

    With --cloud, deletes the custom cloud network policy for your account and
    leaves the local daemon alone. You will be prompted for confirmation unless
    --force is used. Afterwards the default the server now stores is printed.
usage: sbx policy reset [flags]
options:
    - name: force
      shorthand: f
      default_value: "false"
      usage: Skip confirmation prompt
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for reset
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
    - name: no-input
      default_value: "false"
      usage: |
        Never prompt; commands that need an answer fail with the command to run instead
example: |4-
      # Reset policies — prompts if sandboxes are running
      sbx policy reset

      # Reset policies without confirmation
      sbx policy reset --force

      # Reset and initialize in a script; use balanced, allow-all, or deny-all
      sbx --no-input policy reset --force && sbx policy init balanced
see_also:
    - sbx policy - Manage sandbox policies
