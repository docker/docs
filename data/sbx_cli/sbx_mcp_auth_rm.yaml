name: sbx mcp auth rm
synopsis: Remove MCP server OAuth credentials
description: |-
    Remove hosted OAuth credentials for registered MCP servers.

    This command does not remove local MCP server registrations. Use 'sbx mcp rm'
    to remove a registration.
usage: sbx mcp auth rm [server-name] [flags]
options:
    - name: all
      default_value: "false"
      usage: Apply to all registered OAuth servers
    - name: format
      default_value: text
      usage: 'Output format: "text" or "json"'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for rm
    - name: json
      default_value: "false"
      usage: Output in JSON format (alias for --format json)
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: cloud-api-url
      default_value: https://api.sandboxes-cloud.docker.com/v1
      usage: |
        Cloud Sandboxes API URL; only used with --cloud. Defaults to prod (https://api.sandboxes-cloud.docker.com/v1). Set DOCKER_CLOUD_API_URL or pass this flag to override.
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
example: |4-
      sbx mcp auth rm --all
      sbx mcp auth rm notion
      sbx mcp auth rm notion --format=json
see_also:
    - sbx mcp auth - Authorize MCP servers
