name: sbx kit builder status
synopsis: Show the kit builder sandbox and build-cache state
experimental: true
usage: sbx kit builder status [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for status
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
see_also:
    - sbx kit builder - Manage the kit builder sandbox
