name: sbx mcp inspect
synopsis: Show MCP server details
description: |
    Show a unique MCP registration. Shared names require selecting the owning sandbox.
usage: sbx mcp inspect NAME [flags]
options:
    - name: format
      usage: 'Output format: table, json or yaml'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for inspect
    - name: json
      default_value: "false"
      usage: Output in JSON format
    - name: sandbox
      usage: Owning sandbox
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
    - name: no-input
      default_value: "false"
      usage: |
        Never prompt; commands that need an answer fail with the command to run instead
example: |4-
      sbx mcp inspect notion
      sbx mcp inspect notion --sandbox my-sbx

      # Machine-readable output for scripting
      sbx mcp inspect notion --json
see_also:
    - sbx mcp - Manage MCP servers
