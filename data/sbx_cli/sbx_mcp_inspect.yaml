name: sbx mcp inspect
synopsis: Show MCP server details
usage: sbx mcp inspect <name> [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for inspect
    - name: json
      default_value: "false"
      usage: Output in JSON format
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: cloud-api-url
      default_value: https://api.sandboxes-cloud.docker.com
      usage: |
        Cloud Sandboxes API base URL; only used with --cloud. Defaults to prod (https://api.sandboxes-cloud.docker.com). Set DOCKER_CLOUD_API_URL or pass this flag to override; a legacy value ending in /v1 is accepted.
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
example: |4-
      sbx mcp inspect notion

      # Machine-readable output for scripting
      sbx mcp inspect notion --json
see_also:
    - sbx mcp - Manage MCP servers
