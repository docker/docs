name: sbx kit validate
synopsis: Validate a kit artifact
experimental: true
description: |-
    Validate that a directory or ZIP file is a valid kit artifact.

    The reference can be a local directory, ZIP file path, or git repository.

    A kit that declares required arguments is invalid until they are
    supplied, so pass the same --kit-arg values you would pass to sbx
    create.
usage: sbx kit validate REFERENCE [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for validate
    - name: json
      default_value: "false"
      usage: Output in JSON format
    - name: kit-arg
      default_value: '[]'
      experimental: true
      usage: |
        Value for an argument the kit declares, as name=value for every kit or kit.name=value for one (can be repeated)
    - name: kit-args-file
      default_value: '[]'
      experimental: true
      usage: |
        File of name=value kit arguments, one per line (can be repeated); --kit-arg overrides
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: cloud-api-url
      default_value: https://api.sandboxes-cloud.docker.com/v1
      usage: |
        Cloud Sandboxes API URL; only used with --cloud. Defaults to prod (https://api.sandboxes-cloud.docker.com/v1). Set DOCKER_CLOUD_API_URL or pass this flag to override.
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
see_also:
    - sbx kit - (Experimental) Manage kit artifacts
