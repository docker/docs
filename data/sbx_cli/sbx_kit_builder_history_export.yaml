name: sbx kit builder history export
synopsis: Export a kit build record into a bundle
experimental: true
usage: sbx kit builder history export [ARGS...] [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for export
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
see_also:
    - sbx kit builder history - Inspect kit build history in the builder sandbox
