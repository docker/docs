name: sbx template ls
synopsis: List template images
description: |
    List all template images stored in the sandbox runtime's image store.
usage: sbx template ls [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for ls
    - name: json
      default_value: "false"
      usage: Output in JSON format
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: cloud-api-url
      default_value: https://api.sandboxes-cloud.docker.com/v1
      usage: |
        Cloud Sandboxes API URL; only used with --cloud. Defaults to prod (https://api.sandboxes-cloud.docker.com/v1). Set DOCKER_CLOUD_API_URL or pass this flag to override.
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
example: |4-
      # List all template images
      sbx template ls

      # Output in JSON format
      sbx template ls --json
see_also:
    - sbx template - Manage sandbox templates
