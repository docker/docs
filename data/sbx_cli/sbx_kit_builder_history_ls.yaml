name: sbx kit builder history ls
synopsis: List kit build records
experimental: true
usage: sbx kit builder history ls [ARGS...] [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for ls
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
example: '  sbx kit builder history ls'
see_also:
    - sbx kit builder history - Show kit build history in the builder sandbox
