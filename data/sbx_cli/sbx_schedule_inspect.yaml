name: sbx schedule inspect
synopsis: Show schedule details
usage: sbx schedule inspect SCHEDULE_ID [flags]
options:
    - name: format
      usage: 'Output format: table, json or yaml'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for inspect
    - name: json
      default_value: "false"
      usage: Output in JSON format
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
    - name: no-input
      default_value: "false"
      usage: |
        Never prompt; commands that need an answer fail with the command to run instead
example: '  sbx --cloud schedule inspect 0b5c6f3e-1d2a-4c8e-9f70-2a6d1e4b8c31'
see_also:
    - sbx schedule - Manage scheduled cloud sandbox runs (cloud-only)
