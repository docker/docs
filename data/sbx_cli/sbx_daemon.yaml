name: sbx daemon
synopsis: Manage sandboxd daemon
usage: sbx daemon COMMAND
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for daemon
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: cloud-api-url
      default_value: https://api.sandboxes-cloud.docker.com/v1
      usage: |
        Cloud Sandboxes API URL; only used with --cloud. Defaults to prod (https://api.sandboxes-cloud.docker.com/v1). Set DOCKER_CLOUD_API_URL or pass this flag to override.
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
see_also:
    - sbx - Manage AI coding agent sandboxes.
    - sbx daemon log-level - Inspect or change sandboxd's per-category log levels
    - sbx daemon restart - Restart the sandboxd daemon
    - sbx daemon start - Start the sandboxd daemon
    - sbx daemon status - Check sandboxd daemon status
    - sbx daemon stop - Stop the sandboxd daemon
