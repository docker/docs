name: sbx secret ls
synopsis: List stored secrets
description: |-
    List stored secrets across global and sandbox scopes.

    With no scope flag, all stored secrets are shown. Use --global to show only
    global secrets, or --sandbox to show only secrets scoped to one sandbox.
usage: sbx secret ls [flags]
options:
    - name: global
      shorthand: g
      default_value: "false"
      usage: Only list global secrets
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for ls
    - name: json
      default_value: "false"
      usage: Output in JSON format
    - name: sandbox
      usage: Only list secrets for one sandbox
    - name: service
      usage: Filter by secret service name
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: cloud-api-url
      default_value: https://api.sandboxes-cloud.docker.com/v1
      usage: |
        Cloud Sandboxes API URL; only used with --cloud. Defaults to prod (https://api.sandboxes-cloud.docker.com/v1). Set DOCKER_CLOUD_API_URL or pass this flag to override.
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
example: |4-
      # List all secrets
      sbx secret ls

      # List only global secrets
      sbx secret ls -g

      # List secrets for a specific sandbox
      sbx secret ls --sandbox my-sandbox

      # Filter by service
      sbx secret ls --service github

      # Machine-readable output for scripting
      sbx secret ls --json
see_also:
    - sbx secret - Manage stored secrets
