name: sbx daemon logs
synopsis: Show the sandboxd daemon log
usage: sbx daemon logs [flags]
options:
    - name: follow
      default_value: "false"
      usage: Keep printing new lines until interrupted
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for logs
    - name: tail
      shorthand: "n"
      default_value: "100"
      usage: Number of recent lines to show
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
    - name: no-input
      default_value: "false"
      usage: |
        Never prompt; commands that need an answer fail with the command to run instead
example: |4-
      sbx daemon logs

      # Keep printing new lines
      sbx daemon logs --follow
see_also:
    - sbx daemon - Manage sandboxd daemon
