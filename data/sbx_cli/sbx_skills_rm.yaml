name: sbx skills rm
synopsis: Remove installed skills
experimental: true
description: |-
    Remove one or more installed skills from Docker Sandboxes.

    Running agents may be reading installed skills. Removal cannot be undone and
    requires confirmation; use --force to skip confirmation in scripts.
usage: sbx skills rm <skill>... [flags]
options:
    - name: force
      shorthand: f
      default_value: "false"
      usage: Skip confirmation prompts
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for rm
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: cloud-api-url
      default_value: https://api.sandboxes-cloud.docker.com/v1
      usage: |
        Cloud Sandboxes API URL; only used with --cloud. Defaults to prod (https://api.sandboxes-cloud.docker.com/v1). Set DOCKER_CLOUD_API_URL or pass this flag to override.
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
see_also:
    - sbx skills - (Experimental) Manage skills available in sandboxes
