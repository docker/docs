name: sbx schedule ls
synopsis: List schedules
usage: sbx schedule ls [flags]
options:
    - name: format
      usage: 'Output format: table, json or yaml'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for ls
    - name: json
      default_value: "false"
      usage: Output in JSON format
    - name: quiet
      shorthand: q
      default_value: "false"
      usage: Only display schedule IDs
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
    - name: no-input
      default_value: "false"
      usage: |
        Never prompt; commands that need an answer fail with the command to run instead
example: '  sbx --cloud schedule ls'
see_also:
    - sbx schedule - Manage scheduled cloud sandbox runs (cloud-only)
