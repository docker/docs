name: sbx version
synopsis: Show Docker Sandboxes version information
usage: sbx version
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for version
    - name: json
      default_value: "false"
      usage: |
        Output in JSON format, including the server version and, when the backend reports them, the runtime component versions
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: cloud-api-url
      default_value: https://api.sandboxes-cloud.docker.com/v1
      usage: |
        Cloud Sandboxes API URL; only used with --cloud. Defaults to prod (https://api.sandboxes-cloud.docker.com/v1). Set DOCKER_CLOUD_API_URL or pass this flag to override.
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
see_also:
    - sbx - Manage AI coding agent sandboxes.
