name: sbx mcp
synopsis: Manage MCP servers
description: |
    Register and manage MCP servers for use with sandbox sessions.
usage: sbx mcp COMMAND
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for mcp
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: cloud-api-url
      default_value: https://api.sandboxes-cloud.docker.com/v1
      usage: |
        Cloud Sandboxes API URL; only used with --cloud. Defaults to prod (https://api.sandboxes-cloud.docker.com/v1). Set DOCKER_CLOUD_API_URL or pass this flag to override.
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
see_also:
    - sbx - Manage AI coding agent sandboxes.
    - sbx mcp add - Register an MCP server
    - sbx mcp auth - Authorize MCP servers
    - sbx mcp inspect - Show MCP server details
    - sbx mcp load - Load an already-registered MCP server into a running sandbox
    - sbx mcp ls - List MCP servers, grouped by the gateway that serves them
    - sbx mcp rm - Remove a registered MCP server
