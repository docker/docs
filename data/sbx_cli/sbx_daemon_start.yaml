name: sbx daemon start
synopsis: Start the sandboxd daemon
usage: sbx daemon start [flags]
options:
    - name: detach
      shorthand: d
      default_value: "false"
      usage: Run daemon in background
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for start
    - name: policy
      usage: |
        Initialize the global network policy: "allow-all", "balanced", or "deny-all"
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: cloud-api-url
      default_value: https://api.sandboxes-cloud.docker.com/v1
      usage: |
        Cloud Sandboxes API URL; only used with --cloud. Defaults to prod (https://api.sandboxes-cloud.docker.com/v1). Set DOCKER_CLOUD_API_URL or pass this flag to override.
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
see_also:
    - sbx daemon - Manage sandboxd daemon
