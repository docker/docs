name: sbx policy log
synopsis: Show sandbox policy logs
description: |-
    Show policy logs for all sandboxes, or filter by a specific sandbox name.

    Displays which hosts were allowed or blocked by the proxy, along with the
    matching rule, proxy type, and request count. Useful for debugging connectivity
    issues or auditing network activity.
usage: sbx policy log [SANDBOX] [flags]
options:
    - name: format
      usage: 'Output format: table, json or yaml'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for log
    - name: json
      default_value: "false"
      usage: Output in JSON format
    - name: limit
      default_value: "0"
      usage: |
        Maximum number of entries to show in each category (allowed and blocked); 0 shows all
    - name: type
      default_value: all
      usage: |
        Filter logs by type: "all", "network", or "filesystem" (filesystem logs are not supported yet; default "all")
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
    - name: no-input
      default_value: "false"
      usage: |
        Never prompt; commands that need an answer fail with the command to run instead
example: |4-
      # Show all policy logs
      sbx policy log

      # Show logs for a specific sandbox
      sbx policy log my-sandbox

      # Output in JSON format
      sbx policy log --json

      # Show up to 20 allowed and 20 blocked entries
      sbx policy log --limit 20
see_also:
    - sbx policy - Manage sandbox policies
