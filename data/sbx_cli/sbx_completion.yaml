name: sbx completion
synopsis: Generate the autocompletion script for the specified shell
description: |
    Generate the autocompletion script for sbx for the specified shell.
    See each sub-command's help for details on how to use the generated script.
usage: sbx completion COMMAND
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for completion
inherited_options:
    - name: cloud
      default_value: "false"
      usage: |
        Dispatch to Docker Cloud Sandboxes API instead of local sandboxd (supported by a growing set of verbs — run 'sbx --cloud --help' for the current list)
    - name: cloud-api-url
      default_value: https://api.sandboxes-cloud.docker.com/v1
      usage: |
        Cloud Sandboxes API URL; only used with --cloud. Defaults to prod (https://api.sandboxes-cloud.docker.com/v1). Set DOCKER_CLOUD_API_URL or pass this flag to override.
    - name: debug
      shorthand: D
      default_value: "false"
      usage: Enable debug logging
see_also:
    - sbx - Manage AI coding agent sandboxes.
    - sbx completion bash - Generate the autocompletion script for bash
    - sbx completion fish - Generate the autocompletion script for fish
    - sbx completion powershell - Generate the autocompletion script for powershell
    - sbx completion zsh - Generate the autocompletion script for zsh
