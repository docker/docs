openapi: 3.2.0
info:
  title: Docker Sandboxes API
  version: v1
  description: |-
    Use this API to create sandboxes, run processes, work with files, and manage sandbox resources. Start with a kit through the SDK, or use the HTTP operations here directly.

    Management requests use an Authorization bearer token. File and process requests go to the sandbox endpoint in core.endpoint.uri and require a short-lived scoped endpoint credential, not the management token. The SDK obtains that credential for you. Each operation also checks its declared permissions. Direct Unix socket access uses the operating system's socket access controls instead of HTTP authentication. Interactive WebSocket operations describe their supported credential transports separately.

    The Docker Cloud API base URL is https://connect.docker.com/sandboxes. Append each /v1 path without removing the base URL's path prefix. For sandbox endpoint operations, use the sandbox endpoint as the base URL instead.

    Operations list their success and error responses. A 202 response means work is still in progress; read the resource until it reaches the expected state. Errors contain a stable code, a message, and optional details. Inspect the code as well as the HTTP status.

    Send the current ETag in If-Match when an operation requires it. Operations that accept Idempotency-Key use that HTTP header to identify retries: the same key and payload return the first result; a different payload fails. Keys are retained for at least 24 hours.

    Lists use pageSize and pageToken. Continue with nextPageToken until it is empty. Supported filters and ordering are listed on each operation. Resource names contain immutable identifiers; displayName is a label. A 64-bit integer is returned as a JSON string; inputs accept a number or a string.
  contact:
    name: Docker Cloud Sandboxes
    url: https://github.com/docker/sandboxes-api
servers:
  - url: https://connect.docker.com/sandboxes
    description: The API base URL. Append the /v1 paths while preserving this URL's path prefix.
paths:
  /v1/files:
    get:
      tags:
        - Files
      summary: List lists directory entries by path ascending.
      description: List lists directory entries by path ascending.
      operationId: list
      parameters:
        - name: path
          in: query
          description: path is the directory path.
          required: true
          schema:
            type: string
            title: path
            minLength: 1
        - name: pageSize
          in: query
          description: |-
            page_size is an optional page size.

            Omitted or zero uses the backend default. Unless the operation states otherwise, page-size limits and handling of larger requests are backend-specific; use the backend support guide. Continue with nextPageToken until it is empty.
          schema:
            type: integer
            title: page_size
          required: false
        - name: pageToken
          in: query
          description: page_token is an optional continuation token.
          schema:
            type: string
            title: page_token
          required: false
        - name: orderBy
          in: query
          description: |-
            order_by is a single order field with optional direction; the portable field is
            path.
          schema:
            type: string
            title: order_by
          required: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesListResponse"
              example:
                entries:
                  - path: example
                    size: 0
                    mode: 0
                    isDir: true
                    type: unspecified
                    linkTarget: example
                nextPageToken: example
        default:
          description: The structured Error body identifies the failure with a stable code and optional typed details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: notFound
                details: []
                message: sandbox not found
      servers:
        - url: "{endpoint}"
          variables:
            endpoint:
              default: https://sandbox.invalid
              description: The sandbox API base URL from Sandbox.core.endpoint.uri; preserve its path prefix when appending /v1 routes. HTTP endpoints require a scoped endpoint bearer; direct Unix sockets use socket access control.
      security:
        - sandboxBearer: []
      x-sbx-serving-surface: sandboxEndpoint
      x-sbx-plane: data
      x-sbx-required-permissions:
        - sandboxesFilesRead
      x-sbx-conditional-permissions: []
      x-sbx-authenticated-only: false
    delete:
      tags:
        - Files
      summary: Remove deletes a path.
      description: |-
        Remove deletes a path. Removing an absent path succeeds. A nonrecursive
        removal of a nonempty directory returns FAILED_PRECONDITION unchanged.
        A recursive removal that stops partway still answers OK: check
        RemoveResponse.failed_path, not the operation status. Removed paths stay removed.
      operationId: remove
      parameters:
        - name: path
          in: query
          description: path is the sandbox path to remove.
          required: true
          schema:
            type: string
            title: path
            minLength: 1
        - name: recursive
          in: query
          description: recursive removes directory contents when true.
          schema:
            type: boolean
            title: recursive
          required: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesRemoveResponse"
              example:
                completedPaths:
                  - example
                completedCount: 0
                failedPath: example
        default:
          description: The structured Error body identifies the failure with a stable code and optional typed details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: notFound
                details: []
                message: sandbox not found
      servers:
        - url: "{endpoint}"
          variables:
            endpoint:
              default: https://sandbox.invalid
              description: The sandbox API base URL from Sandbox.core.endpoint.uri; preserve its path prefix when appending /v1 routes. HTTP endpoints require a scoped endpoint bearer; direct Unix sockets use socket access control.
      security:
        - sandboxBearer: []
      x-sbx-serving-surface: sandboxEndpoint
      x-sbx-plane: data
      x-sbx-required-permissions:
        - sandboxesFilesWrite
      x-sbx-conditional-permissions: []
      x-sbx-authenticated-only: false
  /v1/files/content:
    get:
      tags:
        - Files
      summary: ReadFile returns raw file content over HTTP; Stat exposes file metadata.
      description: |-
        ReadFile returns raw file content over HTTP; Stat exposes file metadata.
        Content above the unary message cap is refused, never truncated.
      operationId: readFile
      parameters:
        - name: path
          in: query
          description: path is the sandbox path of a regular file.
          required: true
          schema:
            type: string
            title: path
            minLength: 1
      responses:
        "200":
          description: Success
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
              example: ""
          headers:
            Content-Length:
              required: true
              description: Exact byte count of the complete file; this response does not use chunked transfer encoding.
              schema:
                type: integer
                minimum: 0
        default:
          description: The structured Error body identifies the failure with a stable code and optional typed details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: notFound
                details: []
                message: sandbox not found
      servers:
        - url: "{endpoint}"
          variables:
            endpoint:
              default: https://sandbox.invalid
              description: The sandbox API base URL from Sandbox.core.endpoint.uri; preserve its path prefix when appending /v1 routes. HTTP endpoints require a scoped endpoint bearer; direct Unix sockets use socket access control.
      security:
        - sandboxBearer: []
      x-sbx-serving-surface: sandboxEndpoint
      x-sbx-plane: data
      x-sbx-required-permissions:
        - sandboxesFilesRead
      x-sbx-conditional-permissions: []
      x-sbx-authenticated-only: false
      x-sbx-http-transfer:
        response:
          mediaType: application/octet-stream
          bytesField: data
      x-sbx-request-schema:
        $ref: "#/components/schemas/FilesReadFileRequest"
      x-sbx-response-schema:
        $ref: "#/components/schemas/FilesReadFileResponse"
    put:
      tags:
        - Files
      summary: WriteFile accepts raw content with path and mode query parameters.
      description: |-
        WriteFile accepts raw content with path and mode query parameters.
        It replaces the complete target state and carries no request_id.
      operationId: writeFile
      parameters:
        - name: path
          in: query
          description: path is the sandbox path.
          required: true
          schema:
            type: string
            title: path
            minLength: 1
        - name: mode
          in: query
          description: |-
            mode carries Unix permission bits. Upload applies mode & 0777, or 0644 when
            that value is zero, without subtracting umask; Download reports stored bits.
          schema:
            type: integer
            title: mode
          required: false
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
            example: ""
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesWriteFileResponse"
              example:
                info:
                  path: example
                  size: 0
                  mode: 0
                  isDir: true
                  type: unspecified
                  linkTarget: example
        default:
          description: The structured Error body identifies the failure with a stable code and optional typed details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: notFound
                details: []
                message: sandbox not found
      servers:
        - url: "{endpoint}"
          variables:
            endpoint:
              default: https://sandbox.invalid
              description: The sandbox API base URL from Sandbox.core.endpoint.uri; preserve its path prefix when appending /v1 routes. HTTP endpoints require a scoped endpoint bearer; direct Unix sockets use socket access control.
      security:
        - sandboxBearer: []
      x-sbx-serving-surface: sandboxEndpoint
      x-sbx-plane: data
      x-sbx-required-permissions:
        - sandboxesFilesWrite
      x-sbx-conditional-permissions: []
      x-sbx-authenticated-only: false
      x-sbx-http-transfer:
        request:
          mediaType: application/octet-stream
          bytesField: data
      x-sbx-request-schema:
        $ref: "#/components/schemas/FilesWriteFileRequest"
      x-sbx-response-schema:
        $ref: "#/components/schemas/FilesWriteFileResponse"
  /v1/files/directories:
    put:
      tags:
        - Files
      summary: Mkdir creates a directory.
      description: |-
        Mkdir creates a directory. Without parents, a missing parent returns
        NOT_FOUND without creating directories. A repeated Mkdir converges when
        the leaf already exists as a directory. A converged call leaves
        the directory's mode unchanged on every request.
      operationId: mkdir
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilesMkdirRequest"
            example:
              path: example
              mode: 0
              parents: true
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesMkdirResponse"
              example: {}
        default:
          description: The structured Error body identifies the failure with a stable code and optional typed details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: notFound
                details: []
                message: sandbox not found
      servers:
        - url: "{endpoint}"
          variables:
            endpoint:
              default: https://sandbox.invalid
              description: The sandbox API base URL from Sandbox.core.endpoint.uri; preserve its path prefix when appending /v1 routes. HTTP endpoints require a scoped endpoint bearer; direct Unix sockets use socket access control.
      security:
        - sandboxBearer: []
      x-sbx-serving-surface: sandboxEndpoint
      x-sbx-plane: data
      x-sbx-required-permissions:
        - sandboxesFilesWrite
      x-sbx-conditional-permissions: []
      x-sbx-authenticated-only: false
  /v1/files/download:
    get:
      tags:
        - Files
      summary: Download streams file headers, bytes, and per-file errors.
      description: |-
        Download streams file headers, bytes, and per-file errors. A path that
        leaves the jail through a symlink, or names a non-regular object, reports
        a FileError with a error reason instead of reading through it.
      operationId: download
      parameters:
        - name: paths
          in: query
          description: |-
            paths naming stable regular files or absent entries at canonical absolute paths
            yield contiguous results in request order, including duplicates.
          required: true
          schema:
            type: array
            items:
              type: string
            title: paths
            minItems: 1
      responses:
        "200":
          description: |-
            Success

            Read metadata followed by one continuous raw content part. JSON controls are separate parts with Content-Type application/json; binary content uses application/octet-stream. A final stream-error part carries the shared Error for a whole-stream failure. A clean closing delimiter with no stream-error is required for success; aborted connections are failures.
          content:
            multipart/mixed:
              itemSchema:
                anyOf:
                  - $ref: "#/components/schemas/FileHeader"
                  - contentMediaType: application/octet-stream
                  - $ref: "#/components/schemas/FileError"
                  - $ref: "#/components/schemas/Error"
              itemEncoding:
                contentType: application/json, application/octet-stream
                headers:
                  Content-Disposition:
                    required: true
                    schema:
                      type: string
                      enum:
                        - attachment; name=metadata
                        - attachment; name=content
                        - attachment; name=error
                        - attachment; name=stream-error
              x-sbx-framing:
                description: Read metadata followed by one continuous raw content part. JSON controls are separate parts with Content-Type application/json; binary content uses application/octet-stream. A final stream-error part carries the shared Error for a whole-stream failure. A clean closing delimiter with no stream-error is required for success; aborted connections are failures.
                parts:
                  metadata:
                    contentType: application/json
                    schema:
                      $ref: "#/components/schemas/FileHeader"
                  content:
                    contentType: application/octet-stream
                    schema:
                      contentMediaType: application/octet-stream
                  error:
                    contentType: application/json
                    schema:
                      $ref: "#/components/schemas/FileError"
                  stream-error:
                    contentType: application/json
                    schema:
                      $ref: "#/components/schemas/Error"
                repeatedItems: true
                requiresClosingDelimiter: true
                requiresTerminal: false
              example:
                path: example
                mode: 0
        default:
          description: The structured Error body identifies the failure with a stable code and optional typed details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: notFound
                details: []
                message: sandbox not found
      servers:
        - url: "{endpoint}"
          variables:
            endpoint:
              default: https://sandbox.invalid
              description: The sandbox API base URL from Sandbox.core.endpoint.uri; preserve its path prefix when appending /v1 routes. HTTP endpoints require a scoped endpoint bearer; direct Unix sockets use socket access control.
      security:
        - sandboxBearer: []
      x-sbx-serving-surface: sandboxEndpoint
      x-sbx-plane: data
      x-sbx-required-permissions:
        - sandboxesFilesRead
      x-sbx-conditional-permissions: []
      x-sbx-authenticated-only: false
      x-sbx-http-transfer:
        response:
          mediaType: multipart/mixed
          bytesField: data
          metadataField: header
          errorField: error
          repeatedItems: true
      x-sbx-request-schema:
        $ref: "#/components/schemas/FilesDownloadRequest"
      x-sbx-response-schema:
        $ref: "#/components/schemas/FilesDownloadResponse"
  /v1/files/move:
    post:
      tags:
        - Files
      summary: Move renames or moves a path.
      description: |-
        Move renames or moves a path. The destination is exact: an existing regular
        file is replaced, the source basename is never appended, and a directory
        destination is refused unchanged. A source or destination that leaves the jail
        through a symlink refuses with FAILED_PRECONDITION and a error reason.
      operationId: move
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilesMoveRequest"
            example:
              from: example
              to: example
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesMoveResponse"
              example: {}
        "409":
          description: |-
            The path resolves through a symlink that does not resolve to a target inside the sandbox jail.

            The path names an existing socket, FIFO, device, or other non-regular object where a regular file is required.

            `from` names a regular file and `to` an existing directory, which `Move` refuses rather than moving the file into it.

            `from` names a directory and `to` an existing path, which `Move` refuses rather than replacing.

            `from` and `to` are on different filesystems, and `Move` never copies the contents to cross the boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                path_authority_symlink_escape:
                  summary: The path resolves through a symlink that does not resolve to a target inside the sandbox jail.
                  value:
                    code: failedPrecondition
                    message: "path_authority_symlink_escape: The path resolves through a symlink that does not resolve to a target inside the sandbox jail."
                path_authority_nonregular_object:
                  summary: The path names an existing socket, FIFO, device, or other non-regular object where a regular file is required.
                  value:
                    code: failedPrecondition
                    message: "path_authority_nonregular_object: The path names an existing socket, FIFO, device, or other non-regular object where a regular file is required."
                move_destination_is_directory:
                  summary: "`from` names a regular file and `to` an existing directory, which `Move` refuses rather than moving the file into it."
                  value:
                    code: failedPrecondition
                    message: "move_destination_is_directory: `from` names a regular file and `to` an existing directory, which `Move` refuses rather than moving the file into it."
                move_destination_occupied:
                  summary: "`from` names a directory and `to` an existing path, which `Move` refuses rather than replacing."
                  value:
                    code: failedPrecondition
                    message: "move_destination_occupied: `from` names a directory and `to` an existing path, which `Move` refuses rather than replacing."
                move_crosses_filesystem:
                  summary: "`from` and `to` are on different filesystems, and `Move` never copies the contents to cross the boundary."
                  value:
                    code: failedPrecondition
                    message: "move_crosses_filesystem: `from` and `to` are on different filesystems, and `Move` never copies the contents to cross the boundary."
        default:
          description: The structured Error body identifies the failure with a stable code and optional typed details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: notFound
                details: []
                message: sandbox not found
      x-sbx-error-responses:
        - code: FAILED_PRECONDITION
          description: The path resolves through a symlink that does not resolve to a target inside the sandbox jail.
          reason: path_authority_symlink_escape
        - code: FAILED_PRECONDITION
          description: The path names an existing socket, FIFO, device, or other non-regular object where a regular file is required.
          reason: path_authority_nonregular_object
        - code: FAILED_PRECONDITION
          description: "`from` names a regular file and `to` an existing directory, which `Move` refuses rather than moving the file into it."
          reason: move_destination_is_directory
        - code: FAILED_PRECONDITION
          description: "`from` names a directory and `to` an existing path, which `Move` refuses rather than replacing."
          reason: move_destination_occupied
        - code: FAILED_PRECONDITION
          description: "`from` and `to` are on different filesystems, and `Move` never copies the contents to cross the boundary."
          reason: move_crosses_filesystem
      servers:
        - url: "{endpoint}"
          variables:
            endpoint:
              default: https://sandbox.invalid
              description: The sandbox API base URL from Sandbox.core.endpoint.uri; preserve its path prefix when appending /v1 routes. HTTP endpoints require a scoped endpoint bearer; direct Unix sockets use socket access control.
      security:
        - sandboxBearer: []
      x-sbx-serving-surface: sandboxEndpoint
      x-sbx-plane: data
      x-sbx-required-permissions:
        - sandboxesFilesWrite
      x-sbx-conditional-permissions: []
      x-sbx-authenticated-only: false
  /v1/files/stat:
    get:
      tags:
        - Files
      summary: Stat reads metadata for one path.
      description: |-
        Stat reads metadata for one path.
        A metadata read has a different response from the file-content resource.
      operationId: stat
      parameters:
        - name: path
          in: query
          description: path is the sandbox path.
          required: true
          schema:
            type: string
            title: path
            minLength: 1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesStatResponse"
              example:
                info:
                  path: example
                  size: 0
                  mode: 0
                  isDir: true
                  type: unspecified
                  linkTarget: example
        default:
          description: The structured Error body identifies the failure with a stable code and optional typed details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: notFound
                details: []
                message: sandbox not found
      servers:
        - url: "{endpoint}"
          variables:
            endpoint:
              default: https://sandbox.invalid
              description: The sandbox API base URL from Sandbox.core.endpoint.uri; preserve its path prefix when appending /v1 routes. HTTP endpoints require a scoped endpoint bearer; direct Unix sockets use socket access control.
      security:
        - sandboxBearer: []
      x-sbx-serving-surface: sandboxEndpoint
      x-sbx-plane: data
      x-sbx-required-permissions:
        - sandboxesFilesRead
      x-sbx-conditional-permissions: []
      x-sbx-authenticated-only: false
  /v1/files/upload:
    post:
      tags:
        - Files
      summary: Upload streams one or more files.
      description: |-
        Upload streams one or more files. The first frame must be FileHeader.
        Writing through a symlink that leaves the jail, or onto an existing
        non-regular object, refuses with FAILED_PRECONDITION and a error reason.
      operationId: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            itemSchema:
              oneOf:
                - type: object
                  properties:
                    metadata:
                      $ref: "#/components/schemas/FileHeader"
                  required:
                    - metadata
                  additionalProperties: false
                - type: object
                  properties:
                    content:
                      contentMediaType: application/octet-stream
                  required:
                    - content
                  additionalProperties: false
            itemEncoding:
              contentType: application/json, application/octet-stream
            x-sbx-framing:
              description: Send ordered metadata/content pairs. Each metadata part is application/json; the following content part is application/octet-stream containing raw bytes, including an empty file. Content-Disposition is form-data with the corresponding part name. Content-Transfer-Encoding is refused. A clean closing multipart delimiter is required; truncated content never completes the current item. Malformed occurrences report invalidArgument with a BadRequest detail identifying the occurrence index and path.
              partOrder:
                - metadata
                - content
              repeatedItems: true
              requiresClosingDelimiter: true
            example:
              metadata:
                path: example
                mode: 0
        description: Send ordered metadata/content pairs. Each metadata part is application/json; the following content part is application/octet-stream containing raw bytes, including an empty file. Content-Disposition is form-data with the corresponding part name. Content-Transfer-Encoding is refused. A clean closing multipart delimiter is required; truncated content never completes the current item. Malformed occurrences report invalidArgument with a BadRequest detail identifying the occurrence index and path.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesUploadResponse"
              example:
                filesWritten: 0
        "409":
          description: |-
            The path resolves through a symlink that does not resolve to a target inside the sandbox jail.

            The path names an existing socket, FIFO, device, or other non-regular object where a regular file is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                path_authority_symlink_escape:
                  summary: The path resolves through a symlink that does not resolve to a target inside the sandbox jail.
                  value:
                    code: failedPrecondition
                    message: "path_authority_symlink_escape: The path resolves through a symlink that does not resolve to a target inside the sandbox jail."
                path_authority_nonregular_object:
                  summary: The path names an existing socket, FIFO, device, or other non-regular object where a regular file is required.
                  value:
                    code: failedPrecondition
                    message: "path_authority_nonregular_object: The path names an existing socket, FIFO, device, or other non-regular object where a regular file is required."
        default:
          description: The structured Error body identifies the failure with a stable code and optional typed details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: notFound
                details: []
                message: sandbox not found
      x-sbx-error-responses:
        - code: FAILED_PRECONDITION
          description: The path resolves through a symlink that does not resolve to a target inside the sandbox jail.
          reason: path_authority_symlink_escape
        - code: FAILED_PRECONDITION
          description: The path names an existing socket, FIFO, device, or other non-regular object where a regular file is required.
          reason: path_authority_nonregular_object
      servers:
        - url: "{endpoint}"
          variables:
            endpoint:
              default: https://sandbox.invalid
              description: The sandbox API base URL from Sandbox.core.endpoint.uri; preserve its path prefix when appending /v1 routes. HTTP endpoints require a scoped endpoint bearer; direct Unix sockets use socket access control.
      security:
        - sandboxBearer: []
      x-sbx-serving-surface: sandboxEndpoint
      x-sbx-plane: data
      x-sbx-required-permissions:
        - sandboxesFilesWrite
      x-sbx-conditional-permissions: []
      x-sbx-authenticated-only: false
      x-sbx-http-transfer:
        request:
          mediaType: multipart/form-data
          bytesField: data
          metadataField: header
          repeatedItems: true
          itemPathField: header.path
      x-sbx-request-schema:
        $ref: "#/components/schemas/FilesUploadRequest"
      x-sbx-response-schema:
        $ref: "#/components/schemas/FilesUploadResponse"
  /v1/identity/exchange:
    post:
      tags:
        - Credentials
      summary: ExchangeDockerCredential consumes an identity token once for the authenticated owner.
      description: |-
