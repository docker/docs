      title: UpdateSecretRequest
      unevaluatedProperties: false
      description: |-
        UpdateSecretRequest replaces secret material.
        service_type must be empty for custom material (server-assigned)
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A bearer credential is required for every HTTP request. Management operations use an API credential; sandbox endpoint operations use an issued credential scoped to the sandbox, audience and permitted actions.
    sandboxBearer:
      type: http
      scheme: bearer
      description: A short-lived bearer issued by createEndpointCredential for this sandbox, audience and explicit permissions. Management credentials are not accepted.
    sandboxWebSocketBearer:
      type: apiKey
      in: header
      name: Sec-WebSocket-Protocol
      description: Sandbox-scoped credential encoded in the non-echoed subprotocol offer declared by x-websocket. Offer the API subprotocol alongside it; use this carrier only when endpoint discovery advertises webSocketSubprotocol. Never combine it with Authorization.
security:
  - bearer: []
tags:
  - name: Files
    description: Read, write, copy, and manage files inside a sandbox.
    x-displayName: Files
    kind: nav
    summary: Files
  - name: Processes
    description: Run commands and interact with processes inside a sandbox.
    x-displayName: Processes
    kind: nav
    summary: Processes
  - name: Credentials
    description: Exchange credentials for the authenticated owner.
    x-displayName: Credentials
    kind: nav
    summary: Credentials
  - name: Images
    description: Manage images used to create sandboxes.
    x-displayName: Images
    kind: nav
    summary: Images
  - name: MCP gateways
    description: Configure MCP gateways and authorize upstream servers.
    x-displayName: MCP gateways
    kind: nav
    summary: MCP gateways
  - name: Network policies
    description: Read enforced outbound network policies and their decision logs.
    x-displayName: Network policies
    kind: nav
    summary: Network policies
  - name: Sandboxes
    description: Create sandboxes and manage their lifecycle, ports, and SSH access.
    x-displayName: Sandboxes
    kind: nav
    summary: Sandboxes
  - name: Secrets
    description: Store credentials and read their metadata without returning secret material.
    x-displayName: Secrets
    kind: nav
    summary: Secrets
  - name: Snapshots
    description: Capture sandbox state and restore it into a new sandbox.
    x-displayName: Snapshots
    kind: nav
    summary: Snapshots
  - name: Volumes
    description: Manage persistent storage and attach it to sandboxes.
    x-displayName: Volumes
    kind: nav
    summary: Volumes
