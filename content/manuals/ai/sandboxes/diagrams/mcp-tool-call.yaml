title: Follow a remote MCP tool call
description: Step through a tool call as the host-side gateway applies policy and credentials.
autoplayDuration: 4000
canvas:
  width: 860
  height: 340
boundaries:
  - id: host
    label: Host machine
    x: 16
    y: 20
    width: 642
    height: 300
    kind: host
  - id: sandbox
    label: Sandbox microVM
    x: 38
    y: 60
    width: 210
    height: 230
    kind: sandbox
nodes:
  - id: agent
    label: AI agent
    description: Calls an MCP tool
    x: 68
    y: 135
    width: 150
    height: 72
    kind: process
  - id: gateway
    label: MCP gateway
    description: Runs on the host
    x: 286
    y: 135
    width: 150
    height: 72
    kind: control
  - id: policy
    label: MCP policy
    description: Checks tool access
    x: 478
    y: 66
    width: 150
    height: 72
    kind: control
  - id: credentials
    label: Credential store
    description: OAuth token stays here
    x: 478
    y: 232
    width: 150
    height: 64
    kind: secret
  - id: server
    label: Remote MCP server
    description: Runs outside the host
    x: 694
    y: 135
    width: 150
    height: 72
    kind: external
edges:
  - id: agent-gateway
    from: agent
    to: gateway
  - id: gateway-policy
    from: gateway
    to: policy
  - id: credentials-gateway
    from: credentials
    to: gateway
  - id: gateway-server
    from: gateway
    to: server
    offset: -8
  - id: server-gateway
    from: server
    to: gateway
    offset: 8
steps:
  - label: The agent requests an MCP tool
    body: The supported agent sends a tool call to the gateway endpoint exposed inside the sandbox.
    activeNodes: [agent, gateway]
    activeEdges: [agent-gateway]
    token:
      edge: agent-gateway
      label: tools/call
      labelOffset: -54
    state: The agent communicates with the host-side gateway, not the remote server directly.
  - label: The gateway checks MCP policy
    body: When organization governance is active, policy determines whether the tool is available.
    activeNodes: [gateway, policy]
    activeEdges: [gateway-policy]
    token:
      edge: gateway-policy
      label: allowed?
      labelOffset: -30
    state: Only tools permitted by active MCP policy can run.
  - label: The gateway uses the host credential
    body: The gateway retrieves the server credential without copying its value into the microVM.
    activeNodes: [gateway, credentials]
    activeEdges: [credentials-gateway]
    token:
      edge: credentials-gateway
      label: OAuth
      labelOffset: -18
    state: The OAuth credential remains in the host credential store.
  - label: The gateway invokes the remote server
    body: The approved tool call leaves the host through the gateway with the required authentication.
    activeNodes: [gateway, server]
    activeEdges: [gateway-server]
    token:
      edge: gateway-server
      label: authenticated call
    state: The remote server receives the call from the gateway.
  - label: The result returns to the agent
    body: The tool result travels back through the gateway to the agent inside the sandbox.
    activeNodes: [server, gateway, agent]
    activeEdges: [server-gateway, agent-gateway]
    token:
      edge: server-gateway
      label: tool result
    state: The result crosses into the microVM; the host credential does not.
