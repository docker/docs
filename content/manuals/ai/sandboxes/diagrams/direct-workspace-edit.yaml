title: Follow a workspace edit in direct mode
description: Step through a file edit as it becomes visible in the working tree on the host.
autoplayDuration: 4000
canvas:
  width: 820
  height: 330
boundaries:
  - id: host
    label: Host machine
    x: 16
    y: 20
    width: 788
    height: 290
    kind: host
  - id: sandbox
    label: Sandbox microVM
    x: 38
    y: 58
    width: 500
    height: 230
    kind: sandbox
nodes:
  - id: agent
    label: AI agent
    description: Edits a file
    x: 68
    y: 126
    width: 150
    height: 72
    kind: process
  - id: mounted-workspace
    label: Mounted workspace
    description: View inside the sandbox
    x: 330
    y: 126
    width: 174
    height: 72
    kind: context
  - id: host-worktree
    label: Host working tree
    description: Same files, not a copy
    x: 612
    y: 86
    width: 166
    height: 72
    kind: context
  - id: host-tools
    label: Host tools
    description: Editor, Git, and builds
    x: 612
    y: 218
    width: 166
    height: 72
    kind: process
edges:
  - id: agent-workspace
    from: agent
    to: mounted-workspace
  - id: workspace-worktree
    from: mounted-workspace
    to: host-worktree
    offset: -10
  - id: worktree-tools
    from: host-worktree
    to: host-tools
steps:
  - label: The agent edits a file
    body: In direct mode, the agent writes to the workspace mounted in the microVM.
    activeNodes: [agent]
    token:
      node: agent
      label: app.py
      placement: bottom
    state: The write begins inside the sandbox.
  - label: The write reaches the mounted workspace
    body: The mounted path gives the sandbox a read-write view of the project directory.
    activeNodes: [agent, mounted-workspace]
    activeEdges: [agent-workspace]
    token:
      edge: agent-workspace
      label: write app.py
    state: Direct mode does not create a private workspace copy.
  - label: The host working tree changes
    body: The mounted workspace and the host working tree refer to the same files.
    activeNodes: [mounted-workspace, host-worktree]
    activeEdges: [workspace-worktree]
    token:
      edge: workspace-worktree
      label: same write
    state: The edit is visible on the host as soon as it is written.
  - label: Host tools see the update
    body: Editors, Git, and build tools on the host observe the changed working tree.
    activeNodes: [host-worktree, host-tools]
    activeEdges: [worktree-tools]
    token:
      edge: worktree-tools
      label: changed
    state: Review workspace changes before running modified code on the host.
