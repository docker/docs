type: topology
title: Explore the sandbox trust boundary
description: Select a component or labeled connection to inspect what is shared, brokered, or isolated.
canvas:
  width: 940
  height: 460
overview:
  category: Overview
  label: The microVM is the primary trust boundary
  body: The agent controls resources inside the microVM. It can cross the boundary only through explicit workspace and skills mounts, or through host gateways. Other host resources have no direct access path.
boundaries:
  - id: host
    label: Host machine
    x: 18
    y: 20
    width: 700
    height: 420
    kind: host
  - id: sandbox
    label: Sandbox microVM
    x: 42
    y: 60
    width: 390
    height: 350
    kind: sandbox
  - id: external
    label: Outside the host
    x: 752
    y: 60
    width: 170
    height: 350
    kind: external
nodes:
  - id: agent
    label: AI agent
    description: Full control in the microVM
    details: The agent has sudo access inside the microVM. It can install packages, run code, and modify resources that are inside the sandbox boundary.
    category: Inside the microVM
    x: 76
    y: 112
    width: 180
    height: 72
    kind: process
  - id: vm-filesystem
    label: VM filesystem
    description: Private to this sandbox
    details: The microVM has its own persistent filesystem. The agent cannot use it to browse files elsewhere on the host.
    category: Inside the microVM
    x: 70
    y: 298
    width: 165
    height: 72
    kind: context
  - id: sandbox-engine
    label: Docker Engine
    description: No host connection
    details: Containers created by the agent run on the Docker Engine inside the microVM. This engine has no connection to the Docker daemon on the host.
    category: Inside the microVM
    x: 250
    y: 298
    width: 150
    height: 72
    kind: control
  - id: workspace
    label: Workspace
    description: Mounted from the host
    details: Direct mode mounts the host working tree read-write, so edits are visible on both sides. Clone mode mounts the host repository read-only and gives the agent a private clone.
    category: Explicitly shared
    x: 492
    y: 72
    width: 190
    height: 72
    kind: shared
  - id: skills
    label: Shared skills store
    description: Optional shared mount
    details: Supported agents mount the host-side skills store read-write unless you opt out. Changes can become visible to agents in other participating sandboxes.
    category: Explicitly shared
    x: 492
    y: 172
    width: 190
    height: 72
    kind: shared
  - id: gateways
    label: Host gateways
    description: Network proxy and MCP
    details: The host proxy and MCP gateway broker approved connections. They apply policy and use host-side credentials without copying credential values into the microVM.
    category: Brokered access
    x: 492
    y: 272
    width: 190
    height: 72
    kind: control
  - id: host-resources
    label: Other host resources
    description: No direct access
    details: The agent has no direct path to the rest of the host filesystem, host processes, or the host Docker daemon. Explicit MCP tools do not expose these resources by default.
    category: Outside the microVM
    x: 492
    y: 372
    width: 190
    height: 54
    kind: restricted
  - id: external-services
    label: Allowed services
    description: Remote services
    details: Remote services run outside the host. The sandbox reaches them through the corresponding host gateway, subject to any active network or MCP policy.
    category: Outside the host
    x: 762
    y: 272
    width: 150
    height: 72
    kind: external
edges:
  - id: workspace-mount
    from: agent
    to: workspace
    label: Workspace mount
    details: This explicit mount is the agent's path to project files on the host. Its permissions depend on whether the sandbox uses direct mode or clone mode.
    category: Shared relationship
    kind: shared
    bidirectional: true
    labelOffset: -18
  - id: skills-mount
    from: agent
    to: skills
    label: Skills mount
    details: This optional read-write mount connects supported agents to a persistent skills store shared through the host.
    category: Shared relationship
    kind: shared
    bidirectional: true
    labelOffset: 2
  - id: gateway-path
    from: agent
    to: gateways
    label: Brokered path
    details: Outbound network and MCP traffic crosses the microVM boundary only through host-side gateways that enforce the applicable policies.
    category: Brokered relationship
    kind: brokered
    bidirectional: true
    labelOffset: 18
  - id: allowed-destinations
    from: gateways
    to: external-services
    label: Policy-controlled
    details: Host gateways apply the relevant network or MCP policy before connecting to remote services.
    category: Brokered relationship
    kind: brokered
    bidirectional: true
    labelOffset: -50
