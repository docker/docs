type: topology
title: Explore the host proxy
description: Select a component or labeled connection to inspect how the host controls outbound access.
canvas:
  width: 720
  height: 560
overview:
  category: Proxy overview
  label: Outbound access is brokered by the host
  body: The sandbox has no direct path to an external network. Its outbound TCP connections pass through network policy and the host proxy, which can inject proxy-managed credentials without copying their values into the microVM.
boundaries:
  - id: host
    label: Host machine
    x: 12
    y: 18
    width: 520
    height: 524
    kind: host
  - id: sandbox
    label: Sandbox microVM
    x: 34
    y: 56
    width: 230
    height: 190
    kind: sandbox
  - id: external
    label: Outside the host
    x: 550
    y: 56
    width: 158
    height: 486
    kind: external
nodes:
  - id: agent
    label: AI agent
    description: Uses sandbox network
    details: The agent can open outbound TCP connections, but it has no direct route to external destinations. DNS and connections use sandbox networking that enforces policy on the host path.
    category: Inside the microVM
    x: 74
    y: 115
    width: 150
    height: 72
    kind: process
  - id: policy
    label: Network policy
    description: Deny by default
    details: Active policy determines which destinations the sandbox can reach. Outbound TCP is blocked unless a rule allows the destination, and direct external UDP and ICMP are blocked.
    category: Host control
    x: 330
    y: 115
    width: 170
    height: 72
    kind: control
  - id: proxy
    label: Host-side proxy
    description: Brokers allowed traffic
    details: The host proxy forwards approved HTTP and HTTPS connections. For proxy-managed credentials, it replaces the sentinel authorization value after the request leaves the microVM.
    category: Host control
    x: 330
    y: 330
    width: 170
    height: 72
    kind: control
  - id: credentials
    label: Credential store
    description: Values stay on host
    details: Stored API keys, OAuth tokens, and dynamic credential sources remain on the host. The proxy retrieves a matching value only when it handles an applicable request.
    category: Host secret
    x: 70
    y: 330
    width: 170
    height: 72
    kind: secret
  - id: external-service
    label: Remote service
    description: Allowed destination
    details: A remote service receives a connection only when active policy permits its destination. It receives any rewritten authentication header from the host proxy.
    category: Outside the host
    x: 558
    y: 330
    width: 142
    height: 72
    kind: external
edges:
  - id: sandbox-policy
    from: agent
    to: policy
    label: Proxied TCP
    details: The sandbox's outbound TCP connection enters the host-controlled path, where policy evaluates its destination.
    category: Brokered relationship
    kind: brokered
    bidirectional: true
    labelOffset: -55
  - id: policy-proxy
    from: policy
    to: proxy
    label: Allowed route
    details: A connection reaches the proxy only when an active allow rule matches the requested destination.
    category: Policy relationship
    kind: brokered
    bidirectional: true
    labelOffset: -60
  - id: credential-lookup
    from: credentials
    to: proxy
    label: Credential lookup
    details: For a proxy-managed credential, the proxy retrieves the value on the host and injects it into the matching request. The raw value does not cross into the microVM.
    category: Credential relationship
    kind: credential
    labelOffset: -50
  - id: proxy-service
    from: proxy
    to: external-service
    label: Approved destination
    details: The proxy carries approved traffic between the sandbox and the remote service, including responses back to the sandbox.
    category: Brokered relationship
    kind: brokered
    bidirectional: true
    labelOffset: -55
